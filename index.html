<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Launch Plan</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1016;
    --bg-2: #121722;
    --panel: #171d2a;
    --panel-2: #1d2433;
    --line: #2a3346;
    --text: #ecebe6;
    --text-2: #b9bcc6;
    --muted: #8a90a0;
    --accent: #f39c34;
    --accent-2: #ffcf7a;
    --blue: #3987e5;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --radius: 10px;
    --gutter: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1c2640 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: var(--accent-2); }
  header.top {
    padding: 14px var(--gutter) 10px;
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(243,156,52,0.08), transparent);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .leaf { width: 30px; height: 30px; flex: none; }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .chip b { color: var(--text); }
  nav.tabs {
    display: flex; gap: 4px; overflow-x: auto; padding: 8px var(--gutter) 0;
    border-bottom: 1px solid var(--line); scrollbar-width: thin; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: rgba(13,16,22,0.94); backdrop-filter: blur(6px);
  }
  nav.tabs button {
    flex: none; background: transparent; color: var(--text-2); border: 1px solid transparent; border-bottom: none;
    padding: 8px 12px; border-radius: 8px 8px 0 0; font: inherit; font-size: 14px; cursor: pointer;
  }
  nav.tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); border-color: var(--line); box-shadow: inset 0 2px 0 var(--accent); }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 16px var(--gutter) 40px; max-width: 1200px; margin: 0 auto; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  p.note { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .grid { display: grid; gap: 12px; }
  .grid.tiles { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .grid.cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .tile .s { color: var(--text-2); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  input, select, textarea {
    background: var(--bg-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 9px; font: inherit; font-size: 14px; max-width: 100%;
  }
  input[type="search"] { min-width: 180px; flex: 1 1 200px; }
  button.btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 600; }
  button.btn.small { padding: 3px 8px; font-size: 12px; }
  .tag { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: 700; vertical-align: 1px; cursor: help; }
  .tag.t-V { background: var(--good); color: #fff; }
  .tag.t-B { background: var(--warning); color: #241800; }
  .tag.t-Q { background: var(--serious); color: #2a0f04; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
  .badge.buy { background: rgba(12,163,12,.18); color: #7fe07f; border-color: rgba(12,163,12,.6); }
  .badge.arb { background: var(--good); color: #fff; }
  .badge.sell { background: rgba(57,135,229,.18); color: #9cc6f7; border-color: rgba(57,135,229,.6); }
  .badge.ceil { background: rgba(208,59,59,.2); color: #f5a3a3; border-color: rgba(208,59,59,.7); }
  .badge.nodata { background: transparent; color: var(--muted); border-color: var(--line); }
  .badge.range { background: transparent; color: var(--text-2); border-color: var(--line); }
  .badge.pri { background: var(--panel-2); color: var(--text-2); border-color: var(--line); font-weight: 500; }
  .badge.role { background: rgba(243,156,52,.15); color: var(--accent-2); border-color: rgba(243,156,52,.5); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; background: var(--panel-2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: rgba(255,255,255,.03); }
  tr.sel td { background: rgba(243,156,52,.08); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .card .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .hd .name { font-weight: 700; font-size: 16px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin: 10px 0; }
  .stats div { font-size: 12px; color: var(--muted); }
  .stats div b { display: block; color: var(--text); font-size: 14px; font-weight: 600; }
  .mgi { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .mgi .bar { flex: 1; height: 8px; background: var(--bg-2); border-radius: 4px; overflow: hidden; }
  .mgi .bar span { display: block; height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; }
  .mgi .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  ul.tight { margin: 4px 0 8px; padding-left: 18px; }
  ul.tight li { margin: 2px 0; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
  .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pc h4 { margin: 6px 0 2px; font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .pros li::marker { color: var(--good); }
  .cons li::marker { color: var(--critical); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .levelbox { display: flex; align-items: center; gap: 6px; }
  .levelbox input { width: 76px; text-align: center; font-size: 18px; font-weight: 700; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--bg-2); color: var(--text-2); border: none; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #1a1206; font-weight: 600; }
  .now { color: var(--accent-2); font-weight: 600; }
  .done { color: var(--muted); text-decoration: line-through; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: none; }
  .check input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
  .check .body { flex: 1; min-width: 0; }
  .check .sub { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .check .result { margin-top: 6px; width: 100%; font-size: 13px; }
  .progress { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; margin: 4px 0 8px; }
  .progress span { display: block; height: 100%; background: var(--accent); }
  .new { color: var(--accent-2); font-size: 11px; font-weight: 700; margin-left: 6px; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  form.add { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; }
  form.add label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  form.add label.wide { grid-column: span 2; }
  .spark { width: 100%; height: 90px; display: block; }
  .spark .ln { fill: none; stroke: var(--blue); stroke-width: 2; }
  .spark .pt { fill: var(--blue); stroke: var(--panel); stroke-width: 2; }
  .spark .ref { stroke: var(--line); stroke-dasharray: 3 3; }
  .spark .lbl { fill: var(--muted); font-size: 10px; }
  .tooltip { position: fixed; pointer-events: none; background: #0b0e14; border: 1px solid var(--line); color: var(--text); font-size: 12px; padding: 5px 8px; border-radius: 6px; z-index: 50; display: none; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--text-2); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--accent); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; display: none; }
  footer { color: var(--muted); font-size: 12px; padding: 0 var(--gutter) 24px; text-align: center; }
  @media (max-width: 640px) {
    body { font-size: 14px; }
    .brand h1 { font-size: 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .pc { grid-template-columns: 1fr; }
    .grid.cards { grid-template-columns: 1fr; }
    form.add label.wide { grid-column: span 1; }
    .kv { grid-template-columns: 1fr; }
    .kv dt { margin-top: 4px; }
    th, td { padding: 6px 8px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="leaf" viewBox="0 0 32 32" aria-hidden="true"><path fill="#f39c34" d="M16 2l2.6 6.2 5.4-3-1.3 6.5 6.3-.6-3.6 5.2 4.6 3.2-6.5 1.5 1.9 6.1-5.6-3.4L16 30l-1.8-6.3-5.6 3.4 1.9-6.1L4 19.5l4.6-3.2L5 11.1l6.3.6L10 5.2l5.4 3z"/><path stroke="#1a1206" stroke-width="1.6" d="M16 30V12"/></svg>
    <div>
      <h1>Classic World Launch Plan</h1>
      <div class="sub" id="subline"></div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main>
  <section class="tab" id="tab-updates" role="tabpanel"></section>
  <section class="tab" id="tab-classes" role="tabpanel"></section>
  <section class="tab" id="tab-route" role="tabpanel"></section>
  <section class="tab" id="tab-farming" role="tabpanel"></section>
  <section class="tab" id="tab-prices" role="tabpanel"></section>
  <section class="tab" id="tab-checklist" role="tabpanel"></section>
  <section class="tab" id="tab-routine" role="tabpanel"></section>
</main>
<footer id="foot"></footer>
<div class="tooltip" id="tip"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>

<script src="data/plan_data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.PLAN_DATA;
  if (!D) {
    document.querySelector("main").innerHTML = '<div class="panel">Could not load <code>data/plan_data.js</code>. Keep it in the <code>data</code> folder next to this file.</div>';
    return;
  }
  var NS = "mscw.";
  var TZ = D.meta.timezone || "America/Chicago";

  /* ---------- storage (namespaced, never throws) ---------- */
  var mem = {};
  function load(key, fallback) {
    try {
      var raw = window.localStorage.getItem(NS + key);
      if (raw == null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return (NS + key) in mem ? mem[NS + key] : fallback; }
  }
  function save(key, value) {
    try { window.localStorage.setItem(NS + key, JSON.stringify(value)); }
    catch (e) { mem[NS + key] = value; }
  }
  /* Characters come from the data (meta.characters), so a class swap needs no code change. */
  var CHARS = (D.meta.characters && D.meta.characters.length) ? D.meta.characters : [{ key: "farmer", label: "Farmer", role: "farmer" }];
  var FARMER = CHARS.filter(function (c) { return c.role === "farmer"; })[0] || CHARS[0];
  function charKey(k) { return D.spPlan[k] ? k : CHARS[0].key; }
  function charLabel(k) { var c = CHARS.filter(function (x) { return x.key === k; })[0]; return c ? (c.short || c.label) : k; }
  /* Schema 2 (v0.6.0): the farmer switched from Fighter to I/L Wizard. A new class is a new character,
     so old Fighter/Hunter levels are archived, not carried over. Also applied to synced and imported state. */
  var SCHEMA = 2;
  function migrateLevels(lv, noFill) {
    var out = {};
    if (lv && typeof lv === "object") for (var k in lv) {
      if (k === "fighter" || k === "hunter") out[k + "Archived"] = lv[k]; else out[k] = lv[k];
    }
    if (!noFill) CHARS.forEach(function (c) { if (out[c.key] == null) out[c.key] = 1; });
    return out;
  }
  function migrateRouteChar(rc) { return (rc && D.spPlan[rc]) ? rc : CHARS[0].key; }
  var S = {
    prices: load("prices", []),
    checks: load("checks", {}),
    notes: load("notes", {}),
    levels: migrateLevels(load("levels", {})),
    routeChar: migrateRouteChar(load("routeChar", null)),
    reviewAck: load("reviewAck", {}),
    lastVisit: load("lastVisit", null),
    weekly: load("weekly", {}),
    tab: load("tab", "updates")
  };
  if (load("schema", 1) < SCHEMA) { save("levels", S.levels); save("routeChar", S.routeChar); save("schema", SCHEMA); }
  var STATE_KEYS = ["checks", "notes", "levels", "reviewAck", "weekly", "lastVisit", "routeChar"];
  function persist(k) {
    save(k, S[k]);
    if (STATE_KEYS.indexOf(k) >= 0) remoteStateSoon();
  }

  /* ---------- optional sync: only inside the published claude.ai copy (owner-only db) ---------- */
  var R_DB = null, stateTimer = null, writeChain = Promise.resolve(), syncState = "local";
  function hasRuntime() { return !!(window.claude && typeof window.claude.use === "function"); }
  function setSync(state, code) {
    syncState = state;
    var chip = document.getElementById("syncChip");
    if (!chip) return;
    var text = { loading: "Syncing…", ok: "Synced to your claude.ai account", off: "Sync off: this device only", error: "Sync problem" + (code ? " (" + code + ")" : "") + ": saving on this device" }[state];
    chip.textContent = text || ""; chip.hidden = !text;
  }
  function remoteQueue(fn) {
    writeChain = writeChain.then(fn).then(function () { if (syncState !== "ok") setSync("ok"); }, function (e) { setSync("error", e && e.code); });
    return writeChain;
  }
  function remoteStateSoon() {
    if (!R_DB) return;
    clearTimeout(stateTimer);
    stateTimer = setTimeout(function () {
      var body = { updatedAt: new Date().toISOString() };
      STATE_KEYS.forEach(function (k) { body[k] = S[k]; });
      remoteQueue(function () { return R_DB.doc("mscw/state").set(JSON.parse(JSON.stringify(body))); });
    }, 800);
  }
  function remotePriceSet(p) { if (R_DB) remoteQueue(function () { return R_DB.collection("prices").doc(p.id).set(JSON.parse(JSON.stringify(p))); }); }
  function remotePriceDel(id) { if (R_DB) remoteQueue(function () { return R_DB.collection("prices").doc(id).delete(); }); }
  function initSync() {
    if (!hasRuntime()) return;
    setSync("loading");
    window.claude.use("db").then(function (db) {
      if (!db) { setSync("off"); return; }
      var remotePrices = [];
      function page(last, guard) {
        var col = db.collection("prices");
        var q = last ? col.where("ts", ">", last).orderBy("ts").limit(1000) : col.orderBy("ts").limit(1000);
        return q.get().then(function (snap) {
          snap.docs.forEach(function (d) { remotePrices.push(JSON.parse(JSON.stringify(d.data()))); });
          if (snap.size === 1000 && guard < 25) return page(snap.docs[snap.docs.length - 1].data().ts, guard + 1);
        });
      }
      return db.doc("mscw/state").get().then(function (st) {
        var rs = st.exists ? st.data() : {};
        return page("", 0).then(function () {
          var localIds = {}, remoteIds = {};
          S.prices.forEach(function (p) { localIds[p.id] = 1; });
          remotePrices.forEach(function (p) { remoteIds[p.id] = 1; if (!localIds[p.id]) S.prices.push(p); });
          var toPush = S.prices.filter(function (p) { return !remoteIds[p.id]; });
          ["checks", "notes", "reviewAck"].forEach(function (k) {
            var r = rs[k]; if (r && typeof r === "object") for (var x in r) if (!(x in S[k])) S[k][x] = r[x];
          });
          if (rs.weekly && typeof rs.weekly === "object") for (var wk in rs.weekly) {
            S.weekly[wk] = S.weekly[wk] || {};
            for (var id in rs.weekly[wk]) if (!(id in S.weekly[wk])) S.weekly[wk][id] = rs.weekly[wk][id];
          }
          if (rs.levels && typeof rs.levels === "object") { var rl = migrateLevels(rs.levels, true); for (var c in rl) S.levels[c] = Math.max(parseInt(S.levels[c], 10) || 1, parseInt(rl[c], 10) || 1); }
          if (rs.lastVisit && (!S.lastVisit || rs.lastVisit > S.lastVisit)) S.lastVisit = rs.lastVisit;
          if (rs.routeChar && load("routeChar", null) == null) S.routeChar = migrateRouteChar(rs.routeChar);
          S.routeChar = migrateRouteChar(S.routeChar);
          ["prices", "checks", "notes", "reviewAck", "weekly", "levels", "lastVisit", "routeChar"].forEach(function (k) { save(k, S[k]); });
          R_DB = db;
          toPush.forEach(remotePriceSet);
          var differs = STATE_KEYS.some(function (k) {
            return JSON.stringify(rs[k] === undefined ? null : rs[k]) !== JSON.stringify(S[k] === undefined ? null : S[k]);
          });
          if (differs) remoteStateSoon();
          setSync("ok");
          renderAll();
        });
      });
    }).catch(function (e) { setSync("error", e && e.code); });
  }

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function fmtInt(n) { return n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("en-US"); }
  function fmtDate(iso, withTime) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    var o = { timeZone: TZ, month: "short", day: "numeric" };
    if (withTime) { o.hour = "numeric"; o.minute = "2-digit"; }
    return d.toLocaleString("en-US", o) + (withTime ? " CT" : "");
  }
  function relTime(iso) {
    var d = new Date(iso); if (isNaN(d)) return "";
    var s = Math.round((Date.now() - d.getTime()) / 1000);
    var a = Math.abs(s), v, u;
    if (a < 3600) { v = Math.round(a / 60); u = "min"; }
    else if (a < 172800) { v = Math.round(a / 3600); u = "h"; }
    else { v = Math.round(a / 86400); u = "d"; }
    return s >= 0 ? v + " " + u + " ago" : "in " + v + " " + u;
  }
  var tierText = D.meta.tierLegend || {};
  function tag(t, src) {
    var key = t === "?" ? "Q" : (t === "B" ? "B" : "V");
    var label = t === "?" ? "?" : t;
    var title = (tierText[t] || "") + (src ? " — Source: " + src : "");
    return '<span class="tag t-' + key + '" title="' + esc(title) + '">' + esc(label) + "</span>";
  }
  function sourceName(id) {
    for (var i = 0; i < D.sources.length; i++) if (D.sources[i].id === id) return D.sources[i];
    return null;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = "none"; }, 2400);
  }
  var tip = $("#tip");
  function showTip(e, text) {
    tip.textContent = text; tip.style.display = "block";
    var x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);

  function spark(obs) {

    if (x1 === x0) x1 = x0 + 1; if (y1 === y0) { y1 = y0 + 1; y0 = y0 - 1; }
    function X(v) { return pad + (v - x0) / (x1 - x0) * (W - 2 * pad); }
    function Y(v) { return H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad - 12); }
    var path = obs.map(function (p, i) { return (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(p.price).toFixed(1); }).join(" ");

  }

  function parseCsv(text) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || (r[0] || "").trim(); });
  }

          return '<div class="check"><input type="checkbox" data-check="' + esc(c.id) + '"' + (on ? " checked" : "") + ' aria-label="' + esc(c.text) + '">' +
            '<div class="body"><div class="' + (on ? "done" : "") + '">' + tag(c.tier, c.source) + " " + esc(c.text) + "</div>" +
            '<div class="sub"><span class="badge pri">' + esc(c.priority) + "</span>" + (c.update ? "<span>Update: " + esc(c.update) + "</span>" : "") + (on ? "<span>✓ " + esc(fmtDate(S.checks[c.id], true)) + "</span>" : "") + "</div>" +
            (isVerify ? '<input class="result" data-note="' + esc(c.id) + '" placeholder="Result (what you found)" value="' + esc(S.notes[c.id] || "") + '">' : "") +
            "</div></div>";
        }).join("") + "</div>";
    });
    el.innerHTML = html;
    $("#cOpen").addEventListener("change", function () { cf.open = this.checked; renderChecklist(); });
    $("#cPri").value = cf.pri;
    $("#cPri").addEventListener("change", function () { cf.pri = this.value; renderChecklist(); });
    $all("[data-check]", el).forEach(function (b) {
      b.addEventListener("change", function () {
        var id = b.getAttribute("data-check");
        if (b.checked) S.checks[id] = new Date().toISOString(); else delete S.checks[id];
        persist("checks"); renderChecklist(); renderUpdates();
      });
    });
    $all("[data-note]", el).forEach(function (inp) {
      inp.addEventListener("change", function () {
        var id = inp.getAttribute("data-note"), v = inp.value.trim();
        if (v) S.notes[id] = v; else delete S.notes[id];
        persist("notes"); toast("Result saved");
      });
    });
  }

  /* ---------- Dual-Character Routine ---------- */
  function renderRoutine() {
    var el = $("#tab-routine"), r = D.routine;
    var wk = isoWeek(new Date());
    var wkChecks = S.weekly[wk] || {};
    function table(rows) {
      return '<div class="table-wrap"><table><thead><tr><th>Block</th><th>Character</th><th>What</th></tr></thead><tbody>' +
        rows.map(function (x) { return "<tr><td>" + esc(x.time) + "</td><td>" + esc(x["char"]) + "</td><td>" + esc(x.what) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    }
    el.innerHTML = '<p class="note">One client at a time. Put the "with friends" block wherever your friends play and the farmer blocks around it. Limit yourself to 2–3 character switches per session. Source: 04_dual_character_ops.md (plan, not fact).</p>' +
      "<h2>Weekday (4 h)</h2>" + table(r.weekday) +
      "<h2>Weekend day (8 h)</h2>" + table(r.weekend) +
      '<h2>Overnight</h2><div class="panel">' + esc(r.overnight) + "</div>" +
      '<h2>Transfer run (about 3 min)</h2><div class="panel"><ol class="tight">' +
      (r.transfer || []).map(li).join("") + "</ol>" +
      '<div style="color:var(--muted);font-size:12px">Deposit fee 100 mesos per item ' + tag("V", "M-ITEM (COT2 datamine)") + " · withdrawal and meso fees " + tag("?", "V-5") + "</div></div>" +
      '<h2>This week (' + wk + ')</h2><div class="panel">' + r.weekly.map(function (x) {
        var on = !!wkChecks[x.id];
        return '<div class="check"><input type="checkbox" data-wk="' + esc(x.id) + '"' + (on ? " checked" : "") + ' aria-label="' + esc(x.text) + '"><div class="body"><div class="' + (on ? "done" : "") + '">' + esc(x.text) + "</div></div></div>";
      }).join("") + '<p class="note">Weekly checks reset each ISO week; past weeks stay in your export.</p></div>';
    $all("[data-wk]", el).forEach(function (b) {
      b.addEventListener("change", function () {
        var id = b.getAttribute("data-wk");
        S.weekly[wk] = S.weekly[wk] || {};
        if (b.checked) S.weekly[wk][id] = new Date().toISOString(); else delete S.weekly[wk][id];
        persist("weekly"); renderRoutine();
      });
    });
  }

  function renderAll() {
    renderHeader(); renderUpdates(); renderClasses(); renderRoute(); renderFarming(); renderPrices(); renderChecklist(); renderRoutine();
  }
  renderTabs();
  renderAll();
  initSync();
  setInterval(renderHeader, 60000);
})();
</script>
</body>
</html>
